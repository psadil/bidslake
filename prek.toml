# Pre-commit hooks for the bidslake workspace, run by prek (https://prek.j178.dev).
#
#   prek install            # install the git hook
#   prek run --all-files    # run every hook against the whole tree
#
# Checks that need no network and no test corpus run here: ruff, `cargo fmt --check`,
# `cargo clippy`, ty, and an offline link check. Anything that runs a test suite
# (cargo test, pytest) or reaches the network belongs in CI, so commits stay quick.
#
# ruff comes from the maintained upstream mirror. The cargo and ty hooks are
# `local` (system cargo / the crate's uv venv): the published Rust mirror
# (doublify/pre-commit-rust) is unmaintained, and astral-sh/ty-pre-commit checks
# a repo-root project and can't target our crates/bidslake-py subdirectory.

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.21"
hooks = [
    { id = "ruff-check", args = ["--fix"], files = '^crates/bidslake-py/.*\.py$' },
    { id = "ruff-format", files = '^crates/bidslake-py/.*\.py$' },
]

# `--offline` resolves relative and anchor links only, with no network, which is both fast
# enough for a hook and the check that actually matters here: the ADRs and the READMEs link
# each other by relative path, so renaming or renumbering a record breaks them silently.
# External URLs are checked in CI instead — a dead upstream link should not block a commit.
[[repos]]
repo = "https://github.com/lycheeverse/lychee"
rev = "lychee-v0.24.2"
hooks = [{ id = "lychee", args = ["--offline", "--no-progress"], files = '\.md$' }]

[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo fmt", language = "system", entry = "cargo fmt --all -- --check", files = '\.rs$', pass_filenames = false },
    { id = "cargo-clippy", name = "cargo clippy", language = "system", entry = "cargo clippy --all-targets -- -D warnings", files = '\.rs$', pass_filenames = false },
    { id = "ty", name = "ty (bidslake-py)", language = "system", entry = "bash -c 'cd crates/bidslake-py && ./.venv/bin/ty check python/bidslake'", files = '^crates/bidslake-py/python/.*\.py$', pass_filenames = false },
]
