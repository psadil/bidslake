[workspace]
members = ["crates/bids-core", "crates/bids-schema", "crates/bidslake", "crates/bids-validator-rs", "crates/hed-validator-rs", "crates/bidslake-py"]
# The pyo3 extension crate builds via maturin, not plain `cargo build`/`test`.
# Excluding it from default-members keeps the existing `cargo test` workflow
# (and CI) untouched; it is still a workspace member so path deps and the lock
# file resolve together.
#
# So prefer `cargo test` over `cargo test --workspace`. Opting the crate in
# needs `PYO3_PYTHON` pointed at an interpreter (as the CI codegen job does):
# a test *binary* has to link libpython, unlike the cdylib maturin builds with
# `-undefined dynamic_lookup`, and without it the link picks the macOS system
# framework and the harness dies at startup with a dyld rpath error. It carries
# no Rust tests of its own — its suite is `crates/bidslake-py`'s pytest.
default-members = ["crates/bids-core", "crates/bids-schema", "crates/bidslake", "crates/bids-validator-rs", "crates/hed-validator-rs"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

# Release builds carry line tables so a sampling profiler (`samply record` on
# macOS, `perf record -g` on Linux) can attribute time to source lines. `debug = 1`
# rather than `2`: line tables are all a sampler needs, and full debuginfo
# meaningfully lengthens the link step — which matters here because `duckdb` is
# built from bundled source. On macOS, `unpacked` skips the `dsymutil` pass on
# every relink.
[profile.release]
debug = 1
split-debuginfo = "unpacked"

# A crate does not acquire a dependency by its appearing here — this table only says which
# version and features a crate gets *if* it opts in with `dep = { workspace = true }`. What it
# buys is that two crates cannot silently disagree, which they had: `bids-validator-rs` pinned
# `ignore = "0.4.27"` against the 0.4.28 below.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["full"] }
regex = "1"
jsonschema = { version = "0.47", default-features = false }
ignore = "0.4.28"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
futures = "0.3"
anyhow = "1"
# Shared by `bidslake` and the `bidslake-py` extension, and they must not drift: cargo builds
# the vendored engine once only while version and features match, and the Arrow types have to
# line up across the FFI boundary. That invariant used to live in a comment.
duckdb = { version = "1.0", features = ["bundled"] }

# Dev-only, but shared, so declared on the same terms. `tempfile` was pinned three different
# ways ("3", "3.8", "3") across three crates before this; "3.8" is the tightest of them, so
# nothing loosens.
criterion = "0.5"
tempfile = "3.8"
# Parameterized cases and fixtures. The suite had no such crate, so "one case per test" was
# spelled as a `for` loop over an inline table — which reports one failing test for N cases
# and stops at the first, the masking CONTRIBUTING.md asks contributors to avoid.
rstest = "0.26"
# Property-based tests: state the rule, let the generator find the case. Note this is *not*
# dev-only in `bids-core`/`bids-schema` — each exposes a `strategy` module behind a `proptest`
# feature so the crates above can reuse one set of generators, and a `[dev-dependencies]`
# entry is not linkable from a downstream crate.
#
# `default-features = false` drops `fork` and `timeout`, which exist to run each case in a
# subprocess so a property that segfaults or hangs still reports. Nothing here can do either —
# these are pure parsers and a JSON merge — and the two would add `rusty-fork`, `quick-error`
# and `wait-timeout` to the lock for no benefit. `bit-set` is kept: it is what proptest shrinks
# collections with, and `bit-set`/`bit-vec` 0.8 are already in the lock via `fancy-regex`.
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }
