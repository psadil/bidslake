name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A failing property shrinks until it cannot simplify further. `max_shrink_iters` already
  # caps that at 4x the case count, but shrinking a case that itself runs the oxc parser is
  # slow in a debug build — bound it by wall clock too, so a red CI reports its counterexample
  # instead of hitting the job timeout with nothing to show.
  PROPTEST_MAX_SHRINK_TIME: "60000"

jobs:
  rust:
    name: rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    # Generated input makes a hang a real failure mode rather than a theoretical one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        # Default-members only (excludes the maturin bidslake-py crate). The
        # whole-corpus tests — the bids-examples smoke test and the tabular
        # coverage sweep — stay #[ignore] and do not run here.
        run: cargo test

  python:
    name: python (pytest · ty)
    runs-on: ubuntu-latest
    # Generated input makes a hang a real failure mode rather than a theoretical one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # `cargo index` (the pytest session fixture) and `maturin develop` both
      # need the Rust toolchain.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Create venv (Python 3.14)
        working-directory: crates/bidslake-py
        run: uv venv --python 3.14
      - name: Install build + test tooling
        working-directory: crates/bidslake-py
        # Installed by name rather than from `[dependency-groups] dev`, so this list and that
        # one have to be kept in step; hypothesis is imported unconditionally by conftest.py,
        # so omitting it here is a collection error, not a silent loss of the properties.
        run: uv pip install maturin pytest hypothesis ty
      - name: Build the extension (editable)
        working-directory: crates/bidslake-py
        run: .venv/bin/maturin develop
      - name: pytest
        working-directory: crates/bidslake-py
        # Includes test_codegen.py (generated COLUMNS == the real DB) and
        # test_typing.py (asserts `ty` rejects a bad-query fixture).
        run: .venv/bin/python -m pytest
      - name: ty
        working-directory: crates/bidslake-py
        run: .venv/bin/ty check python/bidslake

  codegen-drift:
    name: codegen drift (emit-types == committed)
    runs-on: ubuntu-latest
    # No property tests here, but no job should be able to hang the queue either.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Create venv (Python 3.14)
        working-directory: crates/bidslake-py
        run: uv venv --python 3.14
      - name: Regenerate the typed schema module
        # PYO3_PYTHON points cargo's link step at the venv interpreter.
        run: PYO3_PYTHON=$PWD/crates/bidslake-py/.venv/bin/python cargo run -p bidslake-py --bin emit-types
      - name: Fail if the generated schema modules drifted from the schema
        run: git diff --exit-code crates/bidslake-py/python/bidslake/schema/
