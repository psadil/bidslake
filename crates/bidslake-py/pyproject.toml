[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "bidslake"
version = "0.1.0"
description = "Typed querying of bidslake (BIDS-in-DuckDB) datasets"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "polars>=1.9",
    # Query building only. Statements are compiled to a string and run by the Rust engine
    # that owns the connection, so this pulls in no database driver and opens nothing.
    "sqlalchemy>=2.0",
    "universal_pathlib",
]

[project.optional-dependencies]
s3 = ["s3fs"]

[dependency-groups]
dev = ["pytest>=8", "ty", "ruff", "prek"]

[tool.maturin]
module-name = "bidslake._bidslake"
python-source = "python"
bindings = "pyo3"
# Enable the extension-module feature only under maturin; plain cargo builds
# keep it off so the `emit-types` bin (and cargo test) link normally.
features = ["extension-module"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Machine-emitted (their own formatting); don't lint or format them. Reformatting a
# generated file makes the `codegen-drift` CI job fail on the next regeneration.
extend-exclude = [
    "python/bidslake/schema/_generated.py",
    "python/bidslake/schema/models.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
