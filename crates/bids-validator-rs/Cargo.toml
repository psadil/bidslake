[package]
name = "bids-validator-rs"
version.workspace = true
edition.workspace = true
description = "A pure Rust BIDS (Brain Imaging Data Structure) validator"
license = "MIT"

[[bin]]
name = "bids-validator"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
flate2 = "1.1.9"
ignore = { workspace = true }
async-trait = "0.1"
hed-validator-rs = { path = "../hed-validator-rs" }
bids-core = { path = "../bids-core" }
bids-schema = { path = "../bids-schema" }
quick-xml = "0.37"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
# `async_tokio` is layered on top of the workspace version, which the benchmark needs and
# `bidslake`'s criterion does not.
criterion = { workspace = true, features = ["async_tokio"] }
tempfile = { workspace = true }
rlimit = "0.10"
rstest = { workspace = true }

[[bench]]
name = "validation_benchmark"
harness = false
