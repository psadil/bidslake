[package]
name = "bidslake"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { workspace = true }
duckdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
aws-sdk-s3 = { version = "1.15", optional = true }
aws-config = { version = "1.1", optional = true }
futures = { workspace = true }
ignore = { workspace = true }
sha2 = "0.10"
uuid = { workspace = true }
bids-core = { path = "../bids-core" }
bids-schema = { path = "../bids-schema" }

[dev-dependencies]
tokio = { workspace = true }
futures = { workspace = true }
bids-core = { path = "../bids-core" }
bids-schema = { path = "../bids-schema" }
tempfile = { workspace = true }
criterion = { workspace = true }
rstest = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "ingest"
harness = false

[features]
default = []

# Ingest datasets straight from S3 (`bidslake index -i s3://bucket/prefix`).
#
# Opt-in (`--features s3`): the AWS SDK behind it is a large dependency tree —
# twenty-five `aws-*` crates, including the cmake-built `aws-lc-sys` — that a
# purely local install never executes, so leaving it out means a smaller binary
# and a much shorter build. Without the feature, an `s3://` input is refused
# with an explanation rather than being mistaken for a relative directory.
#
# Only the `aws-sdk-s3` client is behind the feature. DuckDB's httpfs extension,
# which is what actually reads `s3://` tabular files, is part of the bundled
# engine either way.
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]

[lints]
workspace = true
