[package]
name = "bidslake"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { workspace = true }
duckdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
aws-sdk-s3 = { version = "1.15", optional = true }
aws-config = { version = "1.1", optional = true }
futures = { workspace = true }
ignore = { workspace = true }
sha2 = "0.10"
bids-core = { path = "../bids-core" }
bids-schema = { path = "../bids-schema" }

[dev-dependencies]
tokio = { workspace = true }
futures = { workspace = true }
bids-core = { path = "../bids-core" }
bids-schema = { path = "../bids-schema" }
tempfile = { workspace = true }
criterion = { workspace = true }
rstest = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "ingest"
harness = false

[features]
default = ["s3"]

# Ingest datasets straight from S3 (`bidslake index -i s3://bucket/prefix`).
#
# On by default, so nothing changes unless you ask. `--no-default-features` drops
# the AWS SDK — a large dependency tree that a purely local install never
# executes — leaving a smaller binary and a much shorter build. Without it, an
# `s3://` input is refused with an explanation rather than being mistaken for a
# relative directory.
#
# Only the `aws-sdk-s3` client is behind the feature. DuckDB's httpfs extension,
# which is what actually reads `s3://` tabular files, is part of the bundled
# engine either way.
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]

[lints]
workspace = true
